spring:
  application:
    name: agent-factory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_factory}
    username: ${DB_USER:agent_factory}
    password: ${DB_PASSWORD:agent_factory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # messaging-support and scheduling-support each ship their own tables under their own path,
    # each reserving a fixed version in the combined sequence (V001 messaging, V002
    # scheduling-shedlock, V003 scheduling-quartz - unused here, not on the classpath) - which is
    # why this service's own migrations start at V4, not V2.
    locations: classpath:db/migration,classpath:db/migration/messaging,classpath:db/migration/scheduling-shedlock
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        max.block.ms: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    apiversion:
      default: 1
      use:
        header: X-API-Version
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/acme}
          authority-prefix: "ROLE_"
          # Keycloak puts realm roles under realm_access.roles, not the flat "scope" claim Boot
          # assumes by default - see libs/security-support's own Javadoc for why this is
          # ['realm_access']['roles'], not claims['realm_access']['roles'].
          authorities-claim-expressions:
            - "['realm_access']['roles']"
  http:
    serviceclient:
      opa:
        base-url: ${OPA_BASE_URL:http://localhost:8181/v1/data/acme/authz/allow}
        connect-timeout: 500ms
        read-timeout: 1s

# Without this, an endpoint that declares no explicit `produces` shows as "*/*" in the
# generated OpenAPI document - technically accurate (content negotiation happens at runtime)
# but useless to a client generator, which needs one concrete media type to generate against.
springdoc:
  default-produces-media-type: application/json

acme:
  messaging:
    stream-prefix: ${STREAM_PREFIX:acme}
    base-packages:
      - com.acme.agentfactory
    auto-provision: true
    kafka:
      max-delivery-attempts: 4
      retry-backoff-ms: 1000
    rabbit:
      max-delivery-attempts: 4
      retry-initial-interval-ms: 1000
      retry-multiplier: 2.0
      retry-max-interval-ms: 10000
  caching:
    base-packages:
      - com.acme.agentfactory

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  observations:
    annotations:
      # See services/order-service/src/main/resources/application.yml for why this is on here
      # and off by Boot 4.1's own default.
      enabled: true

logging:
  level:
    com.acme: INFO
