# Defaults for Boot's own QuartzAutoConfiguration - loaded at the lowest precedence a
# @PropertySource carries, so every value here is a default a service's own application.yml
# overrides freely. See ShedLockAutoConfiguration and docs/principles/P-132-scheduled-jobs.md.
#
# Boot creates the Scheduler bean itself from spring.quartz.*; this module's only job is to
# make that Scheduler clustered rather than in-memory (Boot's own default) and to leave the
# QRTZ_* schema to Flyway rather than Quartz's own startup initializer, matching this
# repository's "Flyway owns the schema" convention (see persistence-support).
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true

# AUTO derives a unique instance id per JVM (host name + timestamp) - required for more than
# one node to tell each other apart in QRTZ_SCHEDULER_STATE. A fixed id would make every node
# claim to be the same scheduler instance, defeating the cluster recovery Quartz is here for.
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.isClustered=true
# How often a node updates its row in QRTZ_SCHEDULER_STATE and checks whether another node
# has gone silent long enough to have its fired triggers recovered.
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=15000
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.useProperties=true
