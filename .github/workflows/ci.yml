name: CI

# The gate is `mvn verify` plus `tools/check-all.sh` - the checks that cannot live in Maven
# because they read git history or the documentation tree. Both halves are runnable locally and
# named as such in AGENTS.md, so that green locally and green here mean the same thing. Nothing
# here may be stricter than what a developer can run before pushing.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # check-migrations.sh asks git whether an applied migration was modified, which needs
          # history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Formatting
        run: mvn $MAVEN_ARGS spotless:check

      - name: Build, lint, architecture and tests
        run: mvn $MAVEN_ARGS verify

      # One script rather than five steps, so that "the gate CI runs" is a thing a developer or an
      # agent can run in one command locally - see AGENTS.md. Splitting it here made the local and
      # CI gates silently different.
      - name: Documentation, contract and migration gate
        if: always()
        run: tools/check-all.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/*-reports/'
          retention-days: 7

  deep-analysis:
    name: Deep static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Slower, and can go red because of an upstream release rather than a change here, so it runs
    # on pull requests where a human is already looking rather than blocking every push.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: SpotBugs and dependency convergence
        run: mvn $MAVEN_ARGS verify -Pdeep-analysis -DskipTests
