name: CI

# The gate is the same one `mvn verify` runs locally, plus the checks that cannot live in Maven
# because they read git history or the documentation tree. Nothing here is allowed to be looser
# than the local build: a developer who is green locally should be green here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # check-migrations.sh asks git whether an applied migration was modified, which needs
          # history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Formatting
        run: mvn $MAVEN_ARGS spotless:check

      - name: Build, lint, architecture and tests
        run: mvn $MAVEN_ARGS verify

      - name: Documentation references resolve
        if: always()
        run: tools/check-doc-links.sh

      - name: Claimed rules exist
        if: always()
        run: tools/check-rule-references.sh

      - name: Error codes match the registry
        if: always()
        run: tools/check-error-codes.sh

      - name: Migrations are immutable and non-destructive
        if: always()
        run: tools/check-migrations.sh

      - name: Principle map is up to date
        if: always()
        run: |
          tools/principle-map.sh
          git diff --exit-code docs/reference/principle-map.md \
            || { echo "::error::docs/reference/principle-map.md is stale. Run tools/principle-map.sh and commit the result."; exit 1; }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/*-reports/'
          retention-days: 7

  deep-analysis:
    name: Deep static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Slower, and can go red because of an upstream release rather than a change here, so it runs
    # on pull requests where a human is already looking rather than blocking every push.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: SpotBugs and dependency convergence
        run: mvn $MAVEN_ARGS verify -Pdeep-analysis -DskipTests
